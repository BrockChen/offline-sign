# xcodegen 配置：生成可用 Xcode 打开的 SignerPoC.xcodeproj
# 生成：  cd firmware/ios-poc && xcodegen generate
# 打开：  open SignerPoC.xcodeproj
name: SignerPoC
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "12.2"
  createIntermediateGroups: true
targets:
  SignerPoC:
    type: application
    platform: iOS
    sources:
      - path: app.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.signerpoc
        SWIFT_OBJC_BRIDGING_HEADER: escore.h
        TARGETED_DEVICE_FAMILY: "1"
        # Apple Silicon 上模拟器为 arm64；xcframework 未含 x86_64 模拟器切片，排除之
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSCameraUsageDescription: "扫描待签交易二维码"
        INFOPLIST_KEY_NSFaceIDUsageDescription: "授权签名"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # 真机安装时在 Xcode 里改成你的免费 Apple ID 团队；模拟器无需签名
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - framework: EspSignerCore.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
