[package]
name = "esp-signer-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# ESP32 固件的「纯 Rust」密钥核心：不依赖 C 版 secp256k1，可在 PC 上单元测试，
# 也能编进 esp-idf(std) 目标。用途：学习/测试网/小额（非防篡改，见 firmware 计划）。

# cdylib 供 Android JNI 出 .so；rlib 供 signer-probe / 测试链接。
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bip32 = { version = "0.5", default-features = false, features = ["alloc", "secp256k1"] }
bip39 = { version = "2", default-features = false, features = ["std"] }
k256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
ripemd = "0.1"
sha3 = "0.10"
bech32 = "0.11"
hex = "0.4"
thiserror = { workspace = true }
ur = "0.5"
minicbor = { version = "2", features = ["alloc"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.2"
base64 = "0.22"

[dev-dependencies]
hex = "0.4"
# 交叉验证：与 x86 版 core（rust-bitcoin/alloy）比对派生/签名一致（仅测试用）
btc-wallate-core = { path = "../../crates/core" }
bitcoin = { workspace = true }
