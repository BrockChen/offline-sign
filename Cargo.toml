[workspace]
resolver = "2"
members = [
    "crates/core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
bitcoin = { version = "0.32", features = ["std", "rand-std"] }
bip39 = { version = "2", features = ["rand"] }
tiny-keccak = { version = "2", features = ["keccak"] }
hex = "0.4"
thiserror = "2"
