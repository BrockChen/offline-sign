[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/app",
    "firmware/signer-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
bitcoin = { version = "0.32", features = ["std", "rand-std", "base64"] }
bip39 = { version = "2", features = ["rand"] }
tiny-keccak = { version = "2", features = ["keccak"] }
hex = "0.4"
thiserror = "2"
alloy = { version = "1", default-features = false, features = ["consensus", "eips", "signers", "signer-local"] }
ur = "0.5"
minicbor = { version = "2", features = ["alloc"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.2"
